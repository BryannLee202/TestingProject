services:
  postgres:
    image: postgres:16
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore_user
      POSTGRES_PASSWORD: bookstore_pass
    # Not published to the host on purpose: anyone who already followed the
    # manual local-db-setup.sql setup likely has host port 5432 bound by
    # their own Postgres server. The backend reaches this container over the
    # internal Compose network at postgres:5432 regardless.
    # Uncomment to inspect this DB from the host (psql/pgAdmin/DBeaver/etc.):
    # ports:
    #   - "5433:5432"
    volumes:
      - bookstore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore_user -d bookstore"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bookstore-net

  backend:
    build:
      context: ./backend
    container_name: bookstore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookstore
      DB_USER: bookstore_user
      DB_PASSWORD: bookstore_pass
      # Optional - enables newsletter emails via NewsletterService. Left
      # blank by default (nothing breaks); set them in a repo-root ".env"
      # file (see .env.example) to turn this on.
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    ports:
      - "8081:8081"
    networks:
      - bookstore-net

  frontend:
    build:
      context: ./frontend
    container_name: bookstore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bookstore-net

volumes:
  bookstore_postgres_data:

networks:
  bookstore-net:
    driver: bridge
