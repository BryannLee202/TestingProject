services:
  mysql:
    image: mysql:8.0
    container_name: bookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookstore
      MYSQL_USER: bookstore_user
      MYSQL_PASSWORD: bookstore_pass
    # Not published to the host on purpose: anyone who already followed the
    # manual local-db-setup.sql/Workbench setup likely has host port 3306
    # bound by their own MySQL80 service. The backend reaches this container
    # over the internal Compose network at mysql:3306 regardless.
    # Uncomment to inspect this DB from the host (Workbench/DBeaver/etc.):
    # ports:
    #   - "3307:3306"
    volumes:
      - bookstore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bookstore-net

  backend:
    build:
      context: ./backend
    container_name: bookstore-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: bookstore
      MYSQLUSER: bookstore_user
      MYSQLPASSWORD: bookstore_pass
    ports:
      - "8081:8081"
    networks:
      - bookstore-net

  frontend:
    build:
      context: ./frontend
    container_name: bookstore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bookstore-net

volumes:
  bookstore_mysql_data:

networks:
  bookstore-net:
    driver: bridge
