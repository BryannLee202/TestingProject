# Server Port
server.port=8080

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bookstore;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-className=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Configuration
# Update database schema automatically (update)
spring.jpa.hibernate.ddl-auto=update

# Show SQL logs in console for debugging
spring.jpa.show-sql=true

# Format the SQL logs
spring.jpa.properties.hibernate.format_sql=true

# Dialect for SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
