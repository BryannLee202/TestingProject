spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=15000
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=270000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ZaloPay (not currently read by ZaloPayConfig.java, which still hardcodes its
# own sandbox constants — kept here only so a future @Value-based refactor has
# somewhere to read real credentials from without falling back to a real key)
zalopay.app-id=${ZALOPAY_APP_ID:2553}
zalopay.key1=${ZALOPAY_KEY1:}
zalopay.key2=${ZALOPAY_KEY2:}
zalopay.endpoint=https://sb-openapi.zalopay.vn/v2/create
