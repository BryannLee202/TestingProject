# Supabase requires SSL. connectTimeout/socketTimeout here are SECONDS for
# pgjdbc (unlike mysql-connector-j, which used milliseconds for the same
# params) - do not copy the old 10000/15000 values verbatim.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require&connectTimeout=10&socketTimeout=15
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=270000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ZaloPay (keep existing from application.properties if any)
zalopay.app-id=2553
