# Active when the backend runs inside the Docker Compose stack defined by
# docker-compose.yml at the repo root (SPRING_PROFILES_ACTIVE=docker, set
# there). Mirrors application-ci.properties's var-driven pattern, but targets
# the "mysql" service name on the Compose network instead of CI's ephemeral
# GitHub Actions service container, and provides defaults matching
# docker-compose.yml's own values so this still works if run outside Compose
# without those env vars set.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql}:${MYSQLPORT:3306}/${MYSQLDATABASE:bookstore}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:bookstore_user}
spring.datasource.password=${MYSQLPASSWORD:bookstore_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# A local containerized MySQL can handle a normal pool - same reasoning as
# application-local.properties (only the free-tier cloud DB in
# application.properties needs the smaller 5-connection pool).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
