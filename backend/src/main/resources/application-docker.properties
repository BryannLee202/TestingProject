# Active when the backend runs inside the Docker Compose stack defined by
# docker-compose.yml at the repo root (SPRING_PROFILES_ACTIVE=docker, set
# there). Mirrors application-ci.properties's var-driven pattern, but targets
# the "postgres" service name on the Compose network instead of CI's ephemeral
# GitHub Actions service container, and provides defaults matching
# docker-compose.yml's own values so this still works if run outside Compose
# without those env vars set.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookstore}?sslmode=disable
spring.datasource.username=${DB_USER:bookstore_user}
spring.datasource.password=${DB_PASSWORD:bookstore_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# A local containerized Postgres can handle a normal pool - same reasoning as
# application-local.properties (only the free-tier cloud DB in
# application.properties needs the smaller 5-connection pool).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
