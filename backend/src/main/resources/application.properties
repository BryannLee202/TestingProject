# Server Port
server.port=${PORT:8081}
server.error.include-message=always

# GZIP Compression - giảm 60-70% dung lượng response
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Tắt show-sql ở production để giảm log thừa (bật lại khi cần debug)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Set explicitly (true = Spring Boot's own default) purely to silence the
# "open-in-view is enabled by default" startup warning. Several controllers
# rely on lazy relations being serialized within the view layer, so actually
# disabling OSIV would need each of those endpoints audited first.
spring.jpa.open-in-view=true

# HikariCP - tối ưu connection pool cho MySQL Clever-Cloud
# Free tier có giới hạn số connection đồng thời thấp, nên chỉ tăng nhẹ từ 2 lên
# 5 để giảm nghẽn request mà vẫn không vượt hạn mức (xem README mục Deployment).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# NOTE: no default datasource is defined here anymore. Every profile actually
# used (local, ci, prod) supplies its own spring.datasource.* — see
# application-local.properties(.example), application-ci.properties and
# application-prod.properties. Running with no active profile has no working
# datasource on purpose, so it fails fast instead of silently pointing at a
# stale SQL Server instance that no longer exists.
# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Email SMTP Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:dinhphan0511@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# VNPay Config (not currently read by VNPayConfig.java, which still hardcodes
# its own sandbox constants — see comment in application-prod.properties)
vnpay.tmnCode=${VNPAY_TMN_CODE:CGXZLS0Z}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${FRONTEND_URL:http://localhost:5173}/payment/vnpay-return
