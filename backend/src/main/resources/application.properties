# Server Port
server.port=${PORT:8081}
server.error.include-message=always

# GZIP Compression - giảm 60-70% dung lượng response
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Tắt show-sql ở production để giảm log thừa (bật lại khi cần debug)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Set explicitly (true = Spring Boot's own default) purely to silence the
# "open-in-view is enabled by default" startup warning. Several controllers
# rely on lazy relations being serialized within the view layer, so actually
# disabling OSIV would need each of those endpoints audited first.
spring.jpa.open-in-view=true

# HikariCP - tối ưu connection pool cho PostgreSQL (Supabase free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

